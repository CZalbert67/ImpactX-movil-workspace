name: Android CI & Security Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Setup JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: 'gradle'

    - name: Change wrapper permissions
      run: chmod +x app/gradlew

    # DevSecOps: Linter y escaneo de vulnerabilidades en código
    - name: Run Android Lint
      run: cd app && ./gradlew lintDebug --continue || true

    # Ejecutar pruebas unitarias locales
    - name: Run Unit Tests
      run: cd app && ./gradlew testDebugUnitTest --continue || true

    # Compilar APK de pruebas para validar build
    - name: Build Debug APK
      run: cd app && ./gradlew assembleDebug
